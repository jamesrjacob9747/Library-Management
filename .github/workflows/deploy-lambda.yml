name: Deploy Backend to Lambda

on:
  push:
    branches:
      - feature/Lambda
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate Prisma Client
      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      # Create Lambda deployment package
      - name: Create Lambda ZIP
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          rm -rf lambda-package lambda.zip
          mkdir lambda-package

          # Copy application files
          cp -r src lambda-package/
          cp -r prisma lambda-package/
          cp prisma.config.js lambda-package/
          cp package.json lambda-package/
          cp package-lock.json lambda-package/

          # Install production dependencies inside package
          cd lambda-package

          npm ci --omit=dev

          # Generate Prisma Client
          npx prisma generate

          # Remove unnecessary cache
          rm -rf node_modules/.cache

          cd ..

          # Create ZIP
          zip -r lambda.zip lambda-package \
            -x "lambda-package/node_modules/.cache/*"

      # Show package size
      - name: Show ZIP size
        run: |
          echo "Lambda ZIP size:"
          ls -lh lambda.zip
          du -h lambda.zip

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Upload ZIP to S3
      - name: Upload Lambda ZIP to S3
        run: |
          aws s3 cp lambda.zip \
            s3://library-management-lambda-deploy-810100779511/lambda.zip

      # Update Lambda code and configuration
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name library-management-backend \
            --s3-bucket library-management-lambda-deploy-810100779511 \
            --s3-key lambda.zip

          aws lambda update-function-configuration \
            --function-name library-management-backend \
            --runtime nodejs24.x \
            --handler lambda-package/src/lambda.handler

      # Wait until Lambda update is complete
      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name library-management-backend

      # Verify Lambda configuration
      - name: Verify Lambda configuration
        run: |
          aws lambda get-function-configuration \
            --function-name library-management-backend \
            --query '{Runtime:Runtime,Handler:Handler,Status:LastUpdateStatus}' \
            --output table

      - name: Deployment complete
        run: |
          echo "========================================="
          echo "Lambda deployment completed successfully"
          echo "Function: library-management-backend"
          echo "Runtime: Node.js 24.x"
          echo "Handler: lambda-package/src/lambda.handler"
          echo "========================================="